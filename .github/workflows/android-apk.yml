# בונה APK להתקנה ישירה על אנדרואיד, בלי חשבון Expo ובלי מחשב.
# הקובץ מופיע בסוף הריצה תחת Artifacts בשם brushing-app-apk.
name: Android APK

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint and tests
        run: |
          npx tsc --noEmit
          npx expo lint
          TZ=Asia/Jerusalem npx jest

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # תבנית Expo חותמת את גרסת ה-release במפתח הדיבאג — מספיק להתקנה ישירה, לא לחנות.
      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: brushing-app-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
